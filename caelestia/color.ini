; Esquemas de color estáticos para quien NO usa el shell Caelestia.
; (Con Caelestia, este archivo lo regenera él solo al cambiar de esquema.)
; Elige uno:  spicetify config color_scheme dark   |   light   →  spicetify apply
; El acento real sale de la portada de la canción (theme.js); estos colores son la base.

